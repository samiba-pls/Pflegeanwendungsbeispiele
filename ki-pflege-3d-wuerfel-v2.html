<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI in der Pflege – 3D-Würfel (v2)</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root{
    --bg:#0e1420;--panel:#161e2e;--ink:#e8edf5;--muted:#93a0b5;--line:#2a364b;
    --ax-x:#f2a65a;--ax-y:#5fd0c5;--ax-z:#b79cff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
  body.transparent{background:transparent}
  .bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
  .bar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sp{flex:1}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:6px;cursor:pointer}
  button:hover{border-color:#5b6f90}
  button:focus-visible{outline:2px solid var(--ax-y);outline-offset:2px}
  button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .stage{position:relative;flex:1;min-height:420px}
  #plot{position:absolute;inset:0}
  .axes{position:absolute;left:14px;bottom:14px;background:rgba(22,30,46,.88);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;pointer-events:none;max-width:260px}
  .axes div{display:flex;align-items:baseline;gap:8px}
  .axes b{font-size:13px;min-width:56px}
  .axes span{color:var(--muted)}
  .axes .x b{color:var(--ax-x)} .axes .y b{color:var(--ax-y)} .axes .z b{color:var(--ax-z)}
  .foot{padding:6px 14px 10px;font-size:11px;color:var(--muted)}
  #err{display:none;padding:24px;color:#ff8a8a}
  @media (max-width:640px){.axes{display:none}.stage{min-height:360px}}
</style>
</head>
<body>
<div class="bar" role="group" aria-label="Darstellung">
  <div class="grp">
    <span class="lbl">Farbe nach</span>
    <button id="bStatus" aria-pressed="true">Status</button>
    <button id="bSetting" aria-pressed="false">Setting</button>
    <button id="bProc" aria-pressed="false">Prozess-Typ</button>
    <button id="bKI" aria-pressed="false">KI-Typ</button>
  </div>
  <span class="sp"></span>
  <div class="grp">
    <button id="bSpin" aria-pressed="false">Drehen</button>
    <button id="bReset">Zurücksetzen</button>
  </div>
</div>
<div class="stage">
  <div id="plot" role="img" aria-label="Dreidimensionales Streudiagramm: KI-Anwendungen in der Pflege nach Setting, Prozess-Typ und KI-Typ"></div>
  <div class="axes" aria-hidden="true">
    <div class="x"><b>WO?</b><span>Pflege-Setting</span></div>
    <div class="y"><b>WOFÜR?</b><span>Prozess-Typ</span></div>
    <div class="z"><b>WOMIT?</b><span>KI-Typ</span></div>
  </div>
</div>
<div id="err">Die Grafik konnte nicht geladen werden (Plotly nicht erreichbar).</div>
<div class="foot">34 Einträge · Punkte in derselben Zelle sind leicht versetzt · „unklar“ / „Mehrere“ markieren Datenlücken bzw. Mehrfachzuordnungen</div>

<script>
if(new URLSearchParams(location.search).get("bg")==="transparent")document.body.classList.add("transparent");

const D=[[3,"EPWUFKI","Hochschule Niederrhein","Pflegedienst","Organisieren","Bild + Sensorik","Forschungsprojekt umgesetzt"],[4,"KIADEKU","Universitätsklinikum Essen","Settingübergreifend","Organisieren","Bild + Sensorik","Forschungsprojekt umgesetzt"],[5,"KIDELIR","Universitätsklinikum Freiburg","Klinik","Organisieren","Prognose + Optimierung","Forschungsprojekt umgesetzt"],[6,"KIP-SDM","Charité","Settingübergreifend","Sonstiges / unklar","Prognose + Optimierung","Forschungsprojekt umgesetzt"],[7,"PfleDaKI","FZI Forschungszentrum Informatik","Settingübergreifend","Sonstiges / unklar","Prognose + Optimierung","Forschungsprojekt umgesetzt"],[8,"PFLIP","Fraunhofer-Institut für Software- und Systemtechnik","Settingübergreifend","Sonstiges / unklar","Prognose + Optimierung","Forschungsprojekt umgesetzt"],[9,"PYSA","voize","Pflegedienst","Organisieren","Sprache + Text","Forschungsprojekt umgesetzt"],[10,"voize","voize.ai","Pflegeheim","Organisieren","Sprache + Text","Im laufenden Einsatz"],[11,"iPAB","Fraunhofer-Institut für Integrierte Schaltungen","Settingübergreifend","Organisieren","Prognose + Optimierung","Forschungsprojekt umgesetzt"],[12,"EMRE-KI","Charité","Klinik","Organisieren","Prognose + Optimierung","Im laufenden Einsatz"],[13,"VReha-PflegeSim","Martin-Luther-Universität Halle-Wittenberg","Sonstiges / unklar","Kommunizieren","Bild + Sensorik","Im laufenden Einsatz"],[14,"LIFT","Martin-Luther-Universität Halle-Wittenberg","Sonstiges / unklar","Sonstiges / unklar","Bild + Sensorik","Im laufenden Einsatz"],[15,"OMNI","Autonomy on Board GmbH, Halle (Saale)","Pflegedienst","Organisieren","Sprache + Text","Im laufenden Einsatz"],[16,"SeeCure","Goodly Technologies GmbH","Pflegedienst","Organisieren","Bild + Sensorik","Im laufenden Einsatz"],[17,"ErgoFee","MinkTec GmbH, Braunschweig","Pflegedienst","Pflegen","Bild + Sensorik","Im laufenden Einsatz"],[18,"ARKIST","Martin-Luther-Universität Halle-Wittenberg","Settingübergreifend","Versorgen","Bild + Sensorik","Im laufenden Einsatz"],[19,"DementiaVoiceBot","Medizinische Universität Lausitz – Carl Thiem","Pflegedienst","Kommunizieren","Sprache + Text","Im laufenden Einsatz"],[20,"SelfRo","Technische Hochschule Mannheim","Pflegeheim","Pflegen","Robotik","Im laufenden Einsatz"],[21,"MAPPLE","Fraunhofer-Institut für Fabrikbetrieb und -automatisierung","Klinik","Pflegen","Robotik","Im laufenden Einsatz"],[22,"HELIA","Universitätsklinikum Würzburg","Klinik","Versorgen","Robotik","Im laufenden Einsatz"],[23,"CICERO","Fraunhofer-Institut für Materialfluss und Logistik","Pflegeheim","Pflegen","Robotik","Im laufenden Einsatz"],[24,"HEART","Neura Robotics GmbH, Metzingen","Pflegeheim","Pflegen","Robotik","Im laufenden Einsatz"],[25,"IKAIWu","sciendis GmbH, Leipzig","Settingübergreifend","Organisieren","Mehrere KI-Typen","Im laufenden Einsatz"],[26,"SafeWalker","Hochschule für Angewandte Wissenschaften Hamburg","Sonstiges / unklar","Sonstiges / unklar","Robotik","Im laufenden Einsatz"],[27,"PräEinsamAltKI","Martin-Luther-Universität Halle-Wittenberg","Pflegedienst","Sonstiges / unklar","Sprache + Text","Im laufenden Einsatz"],[28,"ProSSpon","Perspective Care GmbH, Walzbachtal","Pflegeheim","Organisieren","Prognose + Optimierung","Im laufenden Einsatz"],[29,"ATOSS","Atoss Software; Fraunhofer IKS","Klinik","Organisieren","Prognose + Optimierung","Pilot / Praxistest"],[30,"curevision","cureVision GmbH","Settingübergreifend","Organisieren","Prognose + Optimierung","Im laufenden Einsatz"],[31,"ally cares","ally","Pflegeheim","Pflegen","Prognose + Optimierung","Im laufenden Einsatz"],[32,"Nobi","Nobi","Pflegeheim","Sonstiges / unklar","Bild + Sensorik","Im laufenden Einsatz"],[33,"Homeguardian.ai","Homeguardian.ai","Pflegeheim","Sonstiges / unklar","Bild + Sensorik","Im laufenden Einsatz"],[34,"safety ai","safely you","Pflegeheim","Sonstiges / unklar","Sonstiges / unklar","Im laufenden Einsatz"],[35,"Quema","Quema","Pflegeheim","Sonstiges / unklar","Sonstiges / unklar","Im laufenden Einsatz"],[36,"dexter mobile","dexter health","Settingübergreifend","Kommunizieren","Sprache + Text","Im laufenden Einsatz"]];

const AX={
  s:["Pflegeheim","Pflegedienst","Klinik","Setting-<br>übergreifend","Sonstiges /<br>unklar"],
  p:["Pflegen","Versorgen","Organi-<br>sieren","Kommuni-<br>zieren","Sonstiges /<br>unklar"],
  k:["Robotik","Sprache<br>+ Text","Bild +<br>Sensorik","Prognose +<br>Optimierung","Mehrere<br>KI-Typen","Sonstiges /<br>unklar"]
};
const FULL={
  s:["Pflegeheim","Pflegedienst","Klinik","Settingübergreifend","Sonstiges / unklar"],
  p:["Pflegen","Versorgen","Organisieren","Kommunizieren","Sonstiges / unklar"],
  k:["Robotik","Sprache + Text","Bild + Sensorik","Prognose + Optimierung","Mehrere KI-Typen","Sonstiges / unklar"]
};
const COL={x:"#f2a65a",y:"#5fd0c5",z:"#b79cff"};
const PAL=["#4cc9f0","#f2a65a","#8ddb7a","#e879b9","#f6d55c","#8a94a6"];
const STATUS={"Im laufenden Einsatz":"#4cc9f0","Forschungsprojekt umgesetzt":"#f2a65a","Pilot / Praxistest":"#8ddb7a"};

const cnt={};
const pts=D.map(([id,n,t,s,p,k,u])=>({id,n,t,s,p,k,u,key:[s,p,k].join("|")}));
pts.forEach(q=>{cnt[q.key]=(cnt[q.key]||0)+1;q.i=cnt[q.key];});
pts.forEach(q=>{
  const m=cnt[q.key],a=(q.i-1)/m*2*Math.PI,r=m===1?0:Math.min(.3,.1+.04*m);
  q.x=FULL.s.indexOf(q.s)+r*Math.cos(a);
  q.y=FULL.p.indexOf(q.p)+r*Math.sin(a);
  q.z=FULL.k.indexOf(q.k)+(m===1?0:((q.i%3)-1)*.12);
});

let mode="status";
function groups(){
  const f={status:q=>q.u,setting:q=>q.s,proc:q=>q.p,ki:q=>q.k}[mode];
  const order={status:Object.keys(STATUS),setting:FULL.s,proc:FULL.p,ki:FULL.k}[mode];
  const names=[...new Set(pts.map(f))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return names.map(g=>({g,col:mode==="status"?STATUS[g]:PAL[order.indexOf(g)%PAL.length],items:pts.filter(q=>f(q)===g)}));
}
function traces(){
  const t=groups().map(({g,col,items})=>({
    type:"scatter3d",mode:"markers",name:g+" ("+items.length+")",
    x:items.map(q=>q.x),y:items.map(q=>q.y),z:items.map(q=>q.z),
    text:items.map(q=>"<b>"+q.n+"</b><br>"+q.t+"<br><br>WO: "+q.s+"<br>WOFÜR: "+q.p+"<br>WOMIT: "+q.k+"<br>Status: "+q.u),
    hoverinfo:"text",
    hoverlabel:{bgcolor:"#161e2e",bordercolor:col,font:{color:"#e8edf5",size:12}},
    marker:{size:7,color:col,opacity:1,line:{color:"#0e1420",width:1}}
  }));
  const gx=[],gy=[],gz=[];
  FULL.s.forEach((_,a)=>FULL.p.forEach((_,b)=>FULL.k.forEach((_,c)=>{gx.push(a);gy.push(b);gz.push(c);})));
  t.unshift({type:"scatter3d",mode:"markers",x:gx,y:gy,z:gz,hoverinfo:"skip",showlegend:false,
    marker:{size:1.5,color:"#4a5870",opacity:.6}});
  return t;
}
// Achsen ohne eigene Titel (Titel stehen in der Legende) – Ticks in Achsenfarbe, mit Abstand zum Würfel
const ax=(key,c)=>({title:{text:""},tickmode:"array",tickvals:AX[key].map((_,i)=>i),ticktext:AX[key],
  range:[-.7,AX[key].length-.3],showbackground:true,backgroundcolor:"#121a28",
  gridcolor:"#2a364b",zerolinecolor:"#2a364b",linecolor:c,linewidth:2,showline:true,
  tickfont:{size:10,color:c},ticklen:4});
const cam0={eye:{x:1.7,y:-1.9,z:1.0}};
const layout=()=>({
  margin:{l:0,r:0,t:0,b:0},paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",
  font:{family:"Inter,system-ui,sans-serif",color:"#e8edf5"},
  scene:{xaxis:ax("s",COL.x),yaxis:ax("p",COL.y),zaxis:ax("k",COL.z),
    aspectmode:"manual",aspectratio:{x:1.25,y:1.25,z:1.1},camera:cam0,bgcolor:"rgba(0,0,0,0)"},
  legend:{x:.01,y:.99,bgcolor:"rgba(22,30,46,.88)",bordercolor:"#2a364b",borderwidth:1,font:{size:12,color:"#e8edf5"}}
});
const cfg={responsive:true,displaylogo:false,modeBarButtonsToRemove:["toImage","resetCameraLastSave3d"]};
const el=document.getElementById("plot");
function draw(keepCam){
  if(!window.Plotly){document.getElementById("err").style.display="block";return;}
  const l=layout();
  if(keepCam&&el._fullLayout&&el._fullLayout.scene)l.scene.camera=el._fullLayout.scene.camera;
  Plotly.react(el,traces(),l,cfg);
}
draw();

const btns={status:bStatus,setting:bSetting,proc:bProc,ki:bKI};
Object.entries(btns).forEach(([m,b])=>b.addEventListener("click",()=>{
  mode=m;Object.values(btns).forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");draw(true);
}));
let spin=null,ang=Math.atan2(-1.9,1.7);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function stop(){if(spin){cancelAnimationFrame(spin);spin=null;bSpin.setAttribute("aria-pressed","false");}}
bSpin.addEventListener("click",()=>{
  if(spin){stop();return;}
  bSpin.setAttribute("aria-pressed","true");
  const step=()=>{ang+=reduce?.002:.006;
    Plotly.relayout(el,{"scene.camera.eye":{x:2.5*Math.cos(ang),y:2.5*Math.sin(ang),z:1.0}});
    spin=requestAnimationFrame(step);};
  step();
});
el.addEventListener("pointerdown",stop);
bReset.addEventListener("click",()=>{stop();ang=Math.atan2(-1.9,1.7);Plotly.relayout(el,{"scene.camera":cam0});});
</script>
</body>
</html>
